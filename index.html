<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicLens – AI Complaint Triage</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1a2230;--mut:#667085;--bd:#e3e6ec;--ac:#2557d6;--acx:#fff;--crit:#c8102e;--high:#e8590c;--med:#d9a400;--low:#2f9e5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161d;--card:#1b212b;--tx:#e8ebf0;--mut:#98a2b3;--bd:#2c3441;--ac:#6b93ff;--acx:#0b1220;--crit:#ff5a6e;--high:#ff8a3d;--med:#f2c94c;--low:#4cc38a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 20px 6px;max-width:1200px;margin:auto}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#lang{width:auto;min-width:130px;font-weight:600}
h1{margin:0;font-size:22px}h1 span{color:var(--ac)}
header p{margin:2px 0 0;color:var(--mut)}
main{max-width:1200px;margin:auto;padding:12px 20px 40px;display:grid;grid-template-columns:minmax(290px,380px) 1fr;gap:18px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h2{font-size:15px;margin:0 0 10px}
textarea{width:100%;min-height:110px;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
input[type=text],select{width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 11px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;width:100%;padding:10px;margin-top:10px}
button:disabled{opacity:.6;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font-size:12px;padding:4px 8px;color:var(--mut)}
.lab{font-size:12px;color:var(--mut);margin:10px 0 4px;display:block}
#prev{max-width:100%;max-height:140px;border-radius:8px;margin-top:8px;display:none}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{flex:1;min-width:80px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 10px}
.stat b{font-size:20px;display:block}.stat small{color:var(--mut)}
.bar{display:flex;gap:8px;margin-bottom:10px}
.t{border-left:5px solid var(--bd);margin-bottom:10px}
.t.Critical{border-color:var(--crit)}.t.High{border-color:var(--high)}.t.Medium{border-color:var(--med)}.t.Low{border-color:var(--low)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.badge.Critical{background:var(--crit)}.badge.High{background:var(--high)}.badge.Medium{background:var(--med);color:#222}.badge.Low{background:var(--low)}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:2px 8px;color:var(--mut)}
.t h3{margin:8px 0 2px;font-size:15px}
.why{color:var(--mut);margin:2px 0}
.orig{font-size:13px;color:var(--mut);border-top:1px dashed var(--bd);margin-top:8px;padding-top:6px}
.t img{max-height:90px;border-radius:6px;float:right;margin:0 0 6px 8px}
.dept{font-weight:600}
.err{color:var(--crit);font-size:13px;margin-top:6px}
.src{font-size:11px;color:var(--mut)}
.done{opacity:.55}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.bub{margin-top:12px;background:var(--bg);border:1px solid var(--bd);border-radius:12px 12px 12px 2px;padding:10px 12px}
.bub p{margin:6px 0}
#mic{width:46px;height:46px;border-radius:50%;font-size:22px;padding:0;line-height:1}
#mic.rec{background:var(--crit);color:#fff;border-color:var(--crit)}
.lbr{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.prog{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--low)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.mp text{font:600 12px system-ui,sans-serif;fill:var(--mut)}
details summary{cursor:pointer}
</style></head><body>
<header><div class="hd"><h1>Civic<span>Lens</span> · AI complaint triage</h1>
<select id="lang" aria-label="Language"><option value="en">🌐 English</option><option value="hi">🌐 हिन्दी</option><option value="te">🌐 తెలుగు</option><option value="kn">🌐 ಕನ್ನಡ</option><option value="ta">🌐 தமிழ்</option></select></div>
<p id="t_sub"></p></header>
<main>
<section>
 <div class="card">
  <h2 id="t_new"></h2>
  <textarea id="txt"></textarea>
  <div class="row" style="margin-top:6px"><button type="button" id="mic" aria-label="Speak complaint"></button><span id="micst" class="src" aria-live="polite"></span></div>
  <div class="chips" id="chips"></div>
  <label class="lab" for="loc" id="t_loc"></label>
  <input type="text" id="loc">
  <label class="lab" for="photo" id="t_photo"></label>
  <input type="file" id="photo" accept="image/*">
  <img id="prev" alt="Preview">
  <button class="p" id="go"></button>
  <div class="err" id="err" role="status"></div>
  <div id="reply"></div>
 </div>
</section>
<section>
 <div class="stats" id="stats"></div>
 <div id="v_t"><div class="bar">
  <select id="fd" aria-label="Filter department"></select>
  <select id="fs" aria-label="Filter status"></select>
  <button id="clr"></button>
 </div>
 <div id="list"></div></div>
</section>
</main>

let lang='en';const T=()=>I18N[lang];
const $=id=>document.getElementById(id);
let tickets=[],photoBlob=null,photoURL='',busy=false;

function ld(){try{const s=localStorage.getItem('civiclens');if(s)return JSON.parse(s)}catch(e){}return null}
function sv(){try{localStorage.setItem('civiclens',JSON.stringify(tickets.map(t=>({...t,img:t.img&&t.img.length<150000?t.img:''}))))}catch(e){}}

function ruleTriage(text){
 let best='other',n=0;
 for(const[k,r]of Object.entries(KW)){const m=text.match(new RegExp(r.source,'gi'));if(m&&m.length>n){n=m.length;best=k}}
 if(/drain|sewer|manhole|overflow|మురుగు|డ్రైనేజీ|नाली|सीवर/i.test(text)&&best==='water')best='drainage';
 if(/fallen tree|tree|చెట్టు|पेड़/i.test(text)&&/fell|fallen|block|పడి|गिर/i.test(text))best='trees';
 let s=1,why='Routine civic issue with no stated safety risk.';
 if(CRIT.test(text)){s=3;why='Mentions an immediate danger to life, safety or mobility.'}
 else if(HIGH.test(text)){s=2;why='Persistent or large-scale problem affecting daily life.'}
 else if(LOW.test(text)){s=0;why='Minor / cosmetic issue with little impact.'}
 const lang=/[\u0C80-\u0CFF]/.test(text)?'Kannada':/[\u0B80-\u0BFF]/.test(text)?'Tamil':/[\u0C00-\u0C7F]/.test(text)?'Telugu':/[\u0900-\u097F]/.test(text)?'Hindi':/[\u0600-\u06FF]/.test(text)?'Urdu':'English';
 return{language:lang,summary:text.length>110?text.slice(0,107)+'…':text,category:best,severity:SEV[s],reason:why,location:'',source:'rules'};
}
async function aiTriage(text,loc,blob,nid){
 const sample=await claude.use('sample');
 if(!sample)return null;
 const prompt=`You triage citizen complaints for an Indian municipal corporation. The complaint may be in English, Hindi, Telugu, Kannada, Tamil or another language${blob?', and a photo is attached':''}.
Complaint: """${text||'(no text, see photo)'}"""
Location hint: ${loc||'none'}
Return ONLY a JSON object, no markdown:
{"language":"detected language","summary":"one-line English summary an officer can scan","category":"one of roads|waste|water|electricity|trees|drainage|other","severity":"Low|Medium|High|Critical","reason":"one short English line explaining the severity","location":"location extracted or empty string","duplicate_hint":"short key phrase of issue+place, lowercase","reply":"2-sentence polite acknowledgement to the citizen, written in the complaint's own language: say ticket ${nid} is registered, which department will handle it, and the expected action time (Critical 4 hours, High 24 hours, Medium 3 days, Low 7 days). Make no other promises."}
Severity guide: Critical = immediate danger to life/safety (live wires, open manholes, sinkholes, fallen tree blocking road, gas/major flooding, accident-prone hazard near schools/hospitals). High = serious or prolonged disruption/health risk (burst main, sewage overflow, multi-day no water/garbage, large pothole on main road). Medium = real but non-urgent nuisance. Low = minor/cosmetic. Use the photo evidence if present to raise or lower severity. If drainage vs water is ambiguous, sewage/overflow = drainage, supply/leak = water.`;
 const opts={modelTier:'quick',cache:false};
 if(blob){try{if((await sample.limits()).images)opts.images=[blob]}catch(e){}}
 const r=await sample(prompt,opts);
 const m=(r.text||'').match(/\{[\s\S]*\}/);if(!m)return null;
 const j=JSON.parse(m[0]);
 if(!CATS[j.category])j.category='other';
 if(!SEV.includes(j.severity))j.severity='Medium';
 j.source='ai';return j;
}
function tokens(s){return new Set((s||'').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>3))}
function findDup(t){
 const a=tokens(t.summary+' '+t.location);
 for(const o of tickets){
  if(o.category!==t.category||o.status==='Resolved')continue;
  const b=tokens(o.summary+' '+o.location);let c=0;a.forEach(w=>{if(b.has(w))c++});
  if(c>=3||(t.location&&o.location&&t.location.toLowerCase()===o.location.toLowerCase()))return o.id;
 }return null;
}
async function submit(){
 const text=$('txt').value.trim(),loc=$('loc').value.trim();
 $('err').textContent='';
 if(!text&&!photoBlob){$('err').textContent=T().need;return}
 busy=true;$('go').disabled=true;$('go').textContent=T().busy;
 let r=null,note='';
 const nid='CL-'+(1000+tickets.length+Math.floor(Math.random()*9));try{r=await aiTriage(text,loc,photoBlob,nid)}catch(e){note='AI was unavailable, so the built-in rule engine was used.'}
 if(!r){r=ruleTriage(text||'photo only');if(!note&&!text)note='Photo-only complaints need AI; flagged for manual review.'}
 const t={id:nid,
  ts:Date.now(),text:text||'(photo only)',loc:loc||r.location||'',location:loc||r.location||'',
  summary:r.summary,category:r.category,severity:r.severity,reason:r.reason,language:r.language,
  dept:CATS[r.category].d,status:'Open',source:r.source,img:photoURL,resolvedAt:null};
 t.reply=(r.reply&&String(r.reply).length>10)?String(r.reply):mkReply(r.language,t.id,t.dept,t.severity);t.dup=findDup(t);tickets.push(t);sv();showReply(t);
 $('txt').value='';$('loc').value='';$('photo').value='';photoBlob=null;photoURL='';$('prev').style.display='none';
 $('err').textContent=note;
 busy=false;$('go').disabled=false;$('go').textContent=T().go;render();
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function render(){
 const fd=$('fd').value,fs=$('fs').value;
 const open=tickets.filter(t=>t.status==='Open');
 $('stats').innerHTML=['Critical','High','Medium','Low'].map(s=>`<div class="stat"><b style="color:var(--${s==='Critical'?'crit':s.toLowerCase()})">${open.filter(t=>t.severity===s).length}</b><small>${esc(T().sev[s])} ${esc(T().open)}</small></div>`).join('');
 let L=tickets.filter(t=>(!fd||t.dept===fd)&&(!fs||t.status===fs));
 L.sort((a,b)=>(a.status==='Resolved')-(b.status==='Resolved')||SEV.indexOf(b.severity)-SEV.indexOf(a.severity)||a.ts-b.ts);
 $('list').innerHTML=L.length?L.map(t=>`<article class="card t ${t.severity} ${t.status==='Resolved'?'done':''}">
  ${t.img?`<img src="${t.img}" alt="Complaint photo">`:''}
  <div class="row"><span class="badge ${t.severity}">${esc(T().sev[t.severity])}</span><span class="tag">${esc(CATS[t.category].l)}</span><span class="tag">${esc(t.id)}</span><span class="tag">${esc(t.language)}</span>${t.dup?`<span class="tag" style="color:var(--high)">${esc(T().dup)} ${esc(t.dup)}</span>`:''}</div>
  <h3>${esc(t.summary)}</h3>
  <div class="why">${esc(t.reason)}</div>
  <div class="why">${esc(T().route)}: <span class="dept">${esc(t.dept)}</span>${t.location?' · 📍 '+esc(t.location):''}</div>
  <div class="orig">“${esc(t.text.length>160?t.text.slice(0,157)+'…':t.text)}” <span class="src">· ${t.source==='ai'?'AI triage':'rule-based triage'} · ${new Date(t.ts).toLocaleString()}</span></div>
  <details style="clear:both;margin-top:6px"><summary class="src">📩 ${esc(N('ar'))}</summary><div class="why">${esc(t.reply||'')}</div></details>
  <div class="row" style="margin-top:8px"><button data-r="${t.id}">${t.status==='Open'?esc(T().res):esc(T().reo)}</button>
  <select data-d="${t.id}" aria-label="Override department">${Object.values(CATS).map(c=>`<option ${c.d===t.dept?'selected':''}>${esc(c.d)}</option>`).join('')}</select></div>
 </article>`).join(''):`<div class="card">${esc(T().none)}</div>`;
 const cur=$('fd').value;
 $('fd').innerHTML='<option value="">'+esc(T().all)+'</option>'+Object.values(CATS).map(c=>`<option ${c.d===cur?'selected':''}>${esc(c.d)}</option>`).join('');
}
$('list').addEventListener('click',e=>{const id=e.target.dataset.r;if(!id)return;const t=tickets.find(x=>x.id===id);t.status=t.status==='Open'?'Resolved':'Open';t.resolvedAt=t.status==='Resolved'?Date.now():null;sv();render()});

$('fd').onchange=$('fs').onchange=render;
$('go').onclick=submit;

function setLang(l){
 lang=l;const t=T();
 $('t_sub').textContent=t.sub;$('t_new').textContent=t.nw;$('txt').placeholder=t.ph;
 $('t_loc').textContent=t.loc;$('loc').placeholder=t.locph;$('t_photo').textContent=t.photo;
 if(!busy)$('go').textContent=t.go;$('clr').textContent=t.reset;
 const v=$('fs').value;
 $('fs').innerHTML=`<option value="">${esc(t.both)}</option><option value="Open">${esc(t.oo)}</option><option value="Resolved">${esc(t.ro)}</option>`;$('fs').value=v;
 $('chips').innerHTML=SAMPLES[l].map((s,i)=>`<button data-i="${i}">${esc(t.smp)} ${i+1}</button>`).join('');
 micLabel();
 document.documentElement.lang=l;render();
}
$('lang').onchange=e=>setLang(e.target.value);
$('chips').onclick=e=>{const i=e.target.dataset.i;if(i!=null)$('txt').value=SAMPLES[lang][i]};
$('photo').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const im=new Image();im.onload=()=>{
  const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  photoURL=c.toDataURL('image/jpeg',.7);$('prev').src=photoURL;$('prev').style.display='block';
  c.toBlob(b=>{photoBlob=b},'image/jpeg',.7);URL.revokeObjectURL(im.src)};
 im.src=URL.createObjectURL(f)};

 SAMPLES.en.forEach((s,i)=>{const r=ruleTriage(s);tickets.push({id:'CL-'+(900+i),ts:Date.now()-(6-i)*3600e3,text:s,loc:loc[i],location:loc[i],summary:r.summary,category:r.category,severity:r.severity,reason:r.reason,language:r.language,dept:CATS[r.category].d,status:'Open',source:'rules',img:''})});
}
